# Integración continua: en cada push a main y en cada pull request, GitHub revisa el código
# en una máquina limpia. Si algo falla, el commit queda marcado en rojo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publica solo versiones completas desde la v8: se fija una, no la "v10" suelta
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # --locked: falla si uv.lock no coincide con pyproject.toml, en vez de actualizarlo en silencio
      - name: Instalar dependencias
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formato
        run: uv run ruff format --check .

      - name: Tipos
        run: uv run mypy

      # Los tests no usan claves ni red, salvo tiktoken, que descarga su tokenizador la primera vez
      - name: Tests
        run: uv run pytest -q

  # La imagen se construye y se prueba sin claves: no puede responder preguntas, pero sí
  # demostrar que trae el paquete, el corpus y el golden set, y que no corre como root.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construir la imagen
        run: docker build -t rag-eval-pipeline .

      - name: El golden set coincide con el corpus de la imagen
        run: docker run --rm rag-eval-pipeline rag golden

      - name: El contenedor no corre como root
        run: test "$(docker run --rm rag-eval-pipeline whoami)" = app

      # env_file exige que .env exista; en CI basta uno vacío para validar la sintaxis
      - name: docker-compose.yml es válido
        run: touch .env && docker compose config --quiet
