[project]
name = "rag"
version = "0.1.0"
description = "Pipeline RAG con búsqueda híbrida, citas y evaluación sobre la documentación de FastAPI en español"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "openai>=3.31.0",
    "pymupdf>=1.28.2",
    "tiktoken>=0.14.0",
    "trafilatura>=2.3.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
# El corpus es copia exacta de su fuente: ruff no debe reformatear su Markdown
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Aviso interno de chromadb en Python 3.14; no es de nuestro código
filterwarnings = ["ignore::DeprecationWarning:chromadb.*"]

[tool.mypy]
files = ["src", "tests"]
# Revisa también el cuerpo de las funciones sin anotar (los tests), donde se usan los falsos
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
