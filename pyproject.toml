[project]
name = "rag"
version = "0.1.0"
description = "Pipeline RAG con búsqueda híbrida, citas y evaluación sobre la documentación de FastAPI en español"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.28.2",
    "trafilatura>=2.3.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
# El corpus es copia exacta de su fuente: ruff no debe reformatear su Markdown
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
